name: CI

on:
  push:
  pull_request:

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hr-backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test
        env:
          MONGODB_URI: ""

  retrieval-eval:
    name: Retrieval and intent quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hr-backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      # Scores lexical, dense and hybrid retrieval on identical splits. Dense
      # reads the committed vectors in eval/embeddings.json, so this needs no
      # model download and is deterministic. Fails if any method drops below its
      # floor, or if lexical scores implausibly high on paraphrases -- which would
      # mean the eval queries had leaked into the keyword lists.
      - name: Score retrieval
        run: npm run eval:gate
      # Scores rules against the embedding classifier on four intent sets, and
      # gates on a direct training/eval overlap check rather than on a
      # suspiciously high accuracy -- leakage is measurable, so it is measured.
      - name: Score intent classification
        run: npm run eval:intent:gate

  embeddings-verify:
    name: Embeddings match the corpus
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hr-backend/package-lock.json
      # Installs devDependencies too: the model tooling is dev-only and is
      # deliberately absent from the production image.
      - name: Install dependencies
        run: npm ci
      - name: Cache the sentence-transformer model
        uses: actions/cache@v4
        with:
          path: hr-backend/.model-cache
          key: minilm-fp32-v1
      # Re-embeds the corpus and fails if the committed vectors no longer match.
      # Without this, editing a policy answer and forgetting to re-run
      # `npm run embed` would leave dense retrieval scored against stale vectors
      # with nothing to notice.
      - name: Verify committed embeddings
        run: npm run embed:verify

  backend-smoke:
    name: Backend smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hr-backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Start server
        run: |
          MONGODB_URI="" node server.js &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then break; fi
            sleep 1
          done
      # Asserts on response content, not just status codes. The previous version
      # of this script checked only `response.ok`, so it passed while /chat
      # returned "I couldn't find a matching company policy".
      - name: Run smoke test
        run: npm run smoke
        env:
          BASE_URL: http://127.0.0.1:3000

  backend-docker-build:
    name: Backend Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend service image
        run: docker build --file hr-backend/Dockerfile --tag adaas-hr-backend:${{ github.sha }} .
      # The container resolves the corpus at ../assets relative to WORKDIR, which
      # only lines up because WORKDIR happens to be one level deep. Prove the
      # running image can actually read it rather than trusting the build.
      - name: Verify the image can serve policy questions
        run: |
          docker run -d --name adaas-ci -p 3000:3000 adaas-hr-backend:${{ github.sha }}
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health | tee /tmp/health.json
          grep -q '"status":"running"' /tmp/health.json
          curl -fsS -X POST http://127.0.0.1:3000/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"What is the remote work policy?"}' | tee /tmp/chat.json
          grep -q 'Flexible Work Arrangement Policy' /tmp/chat.json
      - name: Container logs
        if: always()
        run: docker logs adaas-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f adaas-ci || true

  flutter-test:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      # Includes the intent-router accuracy gates and the end-to-end flow tests
      # that assert a failed request is never reported as a success.
      - name: Test
        run: flutter test
