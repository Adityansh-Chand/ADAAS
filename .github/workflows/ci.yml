name: CI

on:
  push:
  pull_request:

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hr-backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test
        env:
          MONGODB_URI: ""

  retrieval-eval:
    name: Retrieval and intent quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hr-backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      # Scores lexical, dense, hybrid and reranked retrieval on identical splits.
      # Reads the committed vectors in eval/embeddings.json and the committed
      # cross-encoder logits in eval/rerank_scores.json, so this needs no model
      # download and is deterministic.
      #
      # Thirteen gates, and they fire in both directions. Eight are strict top-1
      # floors, one per method and eval set. Two are floors on graded nDCG@5 from
      # eval/policy_qrels.json, kept separate from the strict ones because a
      # change that lifts nDCG while dropping top-1 has moved relevant-but-wrong
      # documents up rather than answering more questions. One is a ceiling:
      # lexical retrieval scoring above 0.90 on paraphrases would mean the eval
      # queries had leaked into the keyword lists, so failing upward trips the
      # build too. Two cover abstention -- out-of-scope queries that must return
      # nothing, and the converse check that the thresholds are not buying that by
      # dropping real questions.
      #
      # This step also validates the graded judgements before scoring on them and
      # exits non-zero if any original gold label is graded anything other than 2.
      # That is the guard that stops a graded view from being used to demote an
      # inconvenient label, and it matters because the judgements were written by
      # the same person who tuned the retriever.
      - name: Score retrieval
        run: npm run eval:gate
      # Scores rules against the embedding classifier on five intent sets. Two of
      # the five are clean -- set 3, written before the classifier existed, and
      # set 4, written before it was rewritten -- and both are gated. The third
      # gate is a direct training/eval overlap check rather than a suspiciously
      # high accuracy: leakage is measurable, so it is measured, and it is what
      # caught a case in set 4 that was a near-paraphrase of a training example.
      - name: Score intent classification
        run: npm run eval:intent:gate

  embeddings-verify:
    name: Embeddings match the corpus
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hr-backend/package-lock.json
      # Installs devDependencies too: the model tooling is dev-only and is
      # deliberately absent from the production image.
      - name: Install dependencies
        run: npm ci
      # Keyed on both model names. Two models are downloaded now -- the
      # bi-encoder and the cross-encoder -- and a stale key would silently
      # re-download roughly 200 MB on every run.
      - name: Cache the retrieval models
        uses: actions/cache@v4
        with:
          path: hr-backend/.model-cache
          key: bge-small-mxbai-xsmall-fp32-v1
      # Re-embeds the corpus and fails if the committed vectors no longer match.
      # Without this, editing a policy answer and forgetting to re-run
      # `npm run embed` would leave dense retrieval scored against stale vectors
      # with nothing to notice.
      #
      # Both checks allow one unit of the last stored decimal place. That is not
      # slack for convenience: ONNX genuinely accumulates floating point
      # differently on a different CPU, and an earlier version of this check that
      # demanded exact equality failed here while being correct locally.
      - name: Verify committed embeddings
        run: npm run embed:verify
      # Same contract for the cross-encoder logits. Reranking cannot be scored
      # from the corpus alone -- the model has to see each query paired with each
      # document -- so those scores are committed and verified the same way.
      - name: Verify committed rerank scores
        run: npm run rerank:verify

  backend-smoke:
    name: Backend smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hr-backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Start server
        run: |
          MONGODB_URI="" node server.js &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then break; fi
            sleep 1
          done
      # Asserts on response content, not just status codes. The previous version
      # of this script checked only `response.ok`, so it passed while /chat
      # returned "I couldn't find a matching company policy".
      - name: Run smoke test
        run: npm run smoke
        env:
          BASE_URL: http://127.0.0.1:3000

  backend-docker-build:
    name: Backend Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend service image
        run: docker build --file hr-backend/Dockerfile --tag adaas-hr-backend:${{ github.sha }} .
      # The container resolves the corpus at ../assets relative to WORKDIR, which
      # only lines up because WORKDIR happens to be one level deep. Prove the
      # running image can actually read it rather than trusting the build.
      - name: Verify the image can serve policy questions
        run: |
          docker run -d --name adaas-ci -p 3000:3000 adaas-hr-backend:${{ github.sha }}
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health | tee /tmp/health.json
          grep -q '"status":"running"' /tmp/health.json
          curl -fsS -X POST http://127.0.0.1:3000/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"What is the remote work policy?"}' | tee /tmp/chat.json
          grep -q 'Flexible Work Arrangement Policy' /tmp/chat.json
      - name: Container logs
        if: always()
        run: docker logs adaas-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f adaas-ci || true

  flutter-test:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      # Includes the end-to-end flow tests that assert a failed request is never
      # reported as a success, and the theme contrast gates -- every message kind
      # is checked against its own ground in both light and dark at the WCAG AA
      # threshold, so the class of bug that made the old dark-on-photograph
      # screen unreadable in light mode cannot come back unnoticed.
      - name: Test
        run: flutter test
