services:
  api:
    build:
      context: ..
      dockerfile: hr-backend/Dockerfile
    environment:
      PORT: 3000
      API_KEY: ${API_KEY:-}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      MONGODB_URI: mongodb://mongo:27017/adaas
      # Points the API at the model service instead of an in-process model. This
      # is what makes RETRIEVAL_MODE=dense or =reranked work in a built image:
      # the API image installs with --omit=dev and does not contain
      # @huggingface/transformers at all.
      MODEL_SERVICE_URL: http://models:3100
      # Identity. With OIDC_ISSUER and OIDC_AUDIENCE set the service verifies a
      # real ID token; with only SESSION_SECRET set it enforces scoping over a
      # demo identity; with neither, /health reports authorization: none.
      SESSION_SECRET: ${SESSION_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_EMPLOYEE_CLAIM: ${OIDC_EMPLOYEE_CLAIM:-}
      # Delivery. Both optional; a decision is recorded and stored either way.
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - models
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The only container carrying @huggingface/transformers. It holds no HR data,
  # talks to no database, and its transitive advisories -- adm-zip and sharp, via
  # onnxruntime-node, with no upstream fix -- are now confined to a process whose
  # entire job is turning text into numbers.
  #
  # Not published on the host. A deployment that exposes it has made a mistake
  # this file cannot prevent, but it will not make that mistake by default.
  models:
    build:
      context: ..
      dockerfile: model-service/Dockerfile
    environment:
      MODEL_SERVICE_PORT: 3100
    expose:
      - "3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo-data:
