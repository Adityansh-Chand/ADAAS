apiVersion: apps/v1
kind: Deployment
metadata:
  name: adaas-hr-backend
  labels:
    app: adaas-hr-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: adaas-hr-backend
  template:
    metadata:
      labels:
        app: adaas-hr-backend
    spec:
      # Pod-level, so it applies to every container including any added later.
      # The image already runs as `node`; this is the second half, enforced by the
      # platform rather than trusted from the Dockerfile -- an image can be
      # rebuilt or replaced, and a manifest that assumes it stays unprivileged is
      # assuming something it can simply require.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: adaas-hr-backend:latest
          imagePullPolicy: IfNotPresent
          # Nothing in this service writes outside /app/.data, so the root
          # filesystem is read-only and the one writable path is an explicit
          # volume. This is the control that turns "an attacker got code
          # execution" into "an attacker got code execution and cannot persist".
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/.data
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: adaas-hr-backend-secrets
                  key: api-key
                  optional: true
            # lexical | dense | hybrid. dense and hybrid need the optional
            # embeddings package, which production images omit, so they degrade
            # to lexical and /health reports it.
            - name: RETRIEVAL_MODE
              valueFrom:
                secretKeyRef:
                  name: adaas-hr-backend-secrets
                  key: retrieval-mode
                  optional: true
            # Optional. With no provider configured the service answers
            # policy questions straight from the knowledge base.
            - name: LLM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: adaas-hr-backend-secrets
                  key: llm-provider
                  optional: true
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: adaas-hr-backend-secrets
                  key: llm-api-key
                  optional: true
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: adaas-hr-backend-secrets
                  key: llm-model
                  optional: true
            - name: LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: adaas-hr-backend-secrets
                  key: llm-base-url
                  optional: true
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: adaas-hr-backend-secrets
                  key: mongodb-uri
                  optional: true
          # Readiness asks "can this pod serve policy questions?" -- /health
          # returns 503 when the corpus cannot be read, so a pod that would
          # answer every question with "not found" is taken out of rotation.
          # Previously both probes hit a /health that returned 200
          # unconditionally, which made readiness meaningless.
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Liveness asks only "is the process alive?". It must not depend on the
          # corpus, or a bad asset mount would restart-loop the pod instead of
          # leaving it up and visibly unready.
          livenessProbe:
            httpGet:
              path: /live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        # Notifications are written through to a file so a restart does not lose
        # every decision anyone was told about. emptyDir is honest about what that
        # buys in Kubernetes: it survives a container restart and NOT a
        # rescheduled pod. Durable notifications across pod moves need MONGODB_URI,
        # which is what the Mongo path is for.
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: adaas-hr-backend
spec:
  selector:
    app: adaas-hr-backend
  ports:
    - port: 80
      targetPort: 3000
